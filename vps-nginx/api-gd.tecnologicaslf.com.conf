# API Laravel - api-gd.tecnologicaslf.com (producción GD)
# Proxy al contenedor API (puerto 8585)

server {
    listen 80;
    listen [::]:80;
    server_name api-gd.tecnologicaslf.com;

    # Radicación: adjuntos hasta 10 MB (alineado con Laravel max:10240 y PHP upload_max_filesize).
    client_max_body_size 12M;
    client_body_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8585;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
    }
}
